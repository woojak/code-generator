name: Build Pallet Label APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Core parser self-test
        run: |
          rm -rf build/core-test
          mkdir -p build/core-test
          javac -d build/core-test \
            app/src/main/java/com/labeltools/palletlabel/Gs1Utils.java \
            app/src/main/java/com/labeltools/palletlabel/OcrResult.java \
            app/src/main/java/com/labeltools/palletlabel/OcrParser.java \
            app/src/main/java/com/labeltools/palletlabel/LabelData.java \
            tools/CoreSelfTest.java
          java -cp build/core-test CoreSelfTest

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Prepare named APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Pallet-Label-Generator-v1.3.3-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pallet-Label-Generator-v1.3.3-debug
          path: app/build/outputs/apk/debug/Pallet-Label-Generator-v1.3.3-debug.apk
          if-no-files-found: error
